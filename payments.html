{% extends "base.html" %}
{% block content %}
<h2>Payments</h2>
<div class="card p-4 mb-4">
<h5>Add Payment</h5>
<form method="post" action="/payments/add" class="row g-2">
<input class="form-control" name="booking_id" type="number" placeholder="Booking ID" required>
<input class="form-control" name="amount" type="number" step="0.01" placeholder="Amount" required>
<select class="form-select" name="payment_method"><option>Cash</option><option>Card</option><option>UPI</option></select>
<button class="btn btn-primary">Add Payment</button>
</form>
</div>
<table class="table table-bordered">
<tr><th>ID</th><th>Customer</th><th>Booking</th><th>Amount</th><th>Date</th><th>Method</th></tr>
{% for p in payments %}
<tr><td>{{p.payment_id}}</td><td>{{p.customer_name}}</td><td>{{p.booking_id}}</td><td>₹{{p.amount}}</td><td>{{p.payment_date}}</td><td>{{p.payment_method}}</td></tr>
{% endfor %}
</table>
{% endblock %}
